name: Bangumi Glass UX Emulator Screenshots
on:
  push:
    branches:
      - build/bangumi-glass-complete-ux-20261014
  workflow_dispatch:
jobs:
  android-emulator-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install compilation SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOL="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true
      - name: Boot Pixel emulator and capture UX screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 6000M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euxo pipefail
            gradle --no-daemon -p bangumi-oauth-android :app:assembleDebug
            adb install -r bangumi-oauth-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell settings put global animator_duration_scale 1.0
            adb shell settings put global transition_animation_scale 1.0
            adb shell settings put global window_animation_scale 1.0
            adb shell am start -n com.example.bangumioauthdemo/.BangumiHomeActivity
            sleep 18
            mkdir -p ux_screenshots
            adb exec-out screencap -p > ux_screenshots/01-home.png
            adb shell input tap 550 2250
            sleep 13
            adb exec-out screencap -p > ux_screenshots/02-season-TV.png
            adb shell input tap 960 170
            sleep 3
            adb exec-out screencap -p > ux_screenshots/03-season-filter-sheet.png
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell input tap 320 2250
            sleep 13
            adb exec-out screencap -p > ux_screenshots/04-calendar.png
            adb shell input tap 970 2250
            sleep 5
            adb exec-out screencap -p > ux_screenshots/05-profile.png
            adb shell input tap 550 2250
            sleep 4
            adb shell input tap 85 650
            sleep 2
            adb exec-out screencap -p > ux_screenshots/06-season-selected.png
            adb shell pidof com.example.bangumioauthdemo
            adb logcat -d -v time > ux_screenshots/logcat.txt
            if grep -qE 'FATAL EXCEPTION.*|Fatal signal 11.*RenderThread' ux_screenshots/logcat.txt; then
              echo "Warning: emulator logcat contains fatal crash markers."
              grep -C 5 -E 'FATAL EXCEPTION.*|Fatal signal 11.*RenderThread' ux_screenshots/logcat.txt | head -80
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bangumi-glass-ux-emulator-screenshots
          path: ux_screenshots/
          retention-days: 7
