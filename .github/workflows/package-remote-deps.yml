name: Package remote dependencies

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/package-remote-deps.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned upstream dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/bootstrap out

          # Node.js Mobile FULL flavor only.
          curl -L --fail --retry 5 --retry-delay 2 \
            -o work/node-full-universal.zip \
            "https://github.com/fogtape/nodejs-mobile/releases/download/v24.21.0-0/nodejs-mobile-android-24.21.0-0.zip"

          echo "e3cd29a1be03405f11dd5c857af8cd3ad13f84f1409ea648f5328f0bada5bd76  work/node-full-universal.zip" | sha256sum -c -

          curl -L --fail --retry 5 --retry-delay 2 \
            -o work/node-modules.zip \
            "https://github.com/lilixu3/danmu-api-runtime-packs/releases/download/runtime-dependencies-4be12e7971f0/node_modules.zip"

          echo "4be12e7971f079cd357496974113342f6839919a247e24b4fee69a594301c8a7  work/node-modules.zip" | sha256sum -c -

          BASE="https://raw.githubusercontent.com/lilixu3/danmu-api-android/4d75ca0420d2946956b34ed8c835b4912870a987/app/src/main/assets/nodejs-project"
          for name in main.js android-server.js favorite-scheduler-host.js runtime-polyfills.js startup-failure.js worker-proxy.js; do
            curl -L --fail --retry 5 --retry-delay 2 -o "work/bootstrap/$name" "$BASE/$name"
          done

          curl -L --fail --retry 5 --retry-delay 2 \
            -o work/core-source.zip \
            "https://codeload.github.com/lilixu3/danmu_api/zip/280b2327ccf06fb5e32a1db7051025359121a2c1"

      - name: Build per-ABI full runtime packages
        shell: python
        run: |
          import hashlib, json, shutil, zipfile
          from pathlib import Path

          work = Path("work")
          out = Path("out")
          out.mkdir(exist_ok=True)

          NODE_VERSION = "24.21.0-0"
          CORE_COMMIT = "280b2327ccf06fb5e32a1db7051025359121a2c1"
          SHELL_COMMIT = "4d75ca0420d2946956b34ed8c835b4912870a987"
          ABIS = ("arm64-v8a", "armeabi-v7a", "x86_64")

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def find_native_entries(src, abi):
              chosen = []
              for name in src.namelist():
                  normalized = name.replace("\\", "/")
                  parts = normalized.split("/")
                  base = parts[-1] if parts else ""
                  if abi in parts and base in {"libnode.so", "libc++_shared.so"}:
                      chosen.append((name, base))
              if not any(base == "libnode.so" for _, base in chosen):
                  raise RuntimeError(f"libnode.so not found for {abi}")
              return chosen

          # Preload common JS/runtime data. These are architecture-independent.
          bootstrap_files = {
              p.name: p.read_bytes()
              for p in sorted((work / "bootstrap").iterdir())
              if p.is_file()
          }

          node_modules_entries = []
          with zipfile.ZipFile(work / "node-modules.zip") as src:
              for info in src.infolist():
                  if info.is_dir():
                      continue
                  node_modules_entries.append((info.filename, src.read(info)))

          core_entries = []
          with zipfile.ZipFile(work / "core-source.zip") as src:
              for info in src.infolist():
                  normalized = info.filename.replace("\\", "/")
                  marker = "/danmu_api/"
                  index = normalized.find(marker)
                  if index < 0 or info.is_dir():
                      continue
                  rel = normalized[index + len(marker):]
                  if rel:
                      core_entries.append((rel, src.read(info)))
          if not core_entries:
              raise RuntimeError("No danmu_api core files found")

          packages = []

          with zipfile.ZipFile(work / "node-full-universal.zip") as node_src:
              for abi in ABIS:
                  native_entries = find_native_entries(node_src, abi)

                  # A. Standalone FULL Node runtime for this ABI only.
                  node_zip = out / f"node-runtime-full-{abi}-{NODE_VERSION}.zip"
                  with zipfile.ZipFile(node_zip, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as dst:
                      for source_name, base in native_entries:
                          dst.writestr(f"bin/{abi}/{base}", node_src.read(source_name))

                  # B. Complete LogVar runtime bundle for this ABI only.
                  # Layout matches Android RuntimePaths after extraction:
                  # runtime/libnode.so
                  # project/main.js
                  # project/node_modules/...
                  # project/danmu_api_stable/...
                  bundle = out / f"logvar-runtime-full-{abi}-{NODE_VERSION}.zip"
                  with zipfile.ZipFile(bundle, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as dst:
                      for source_name, base in native_entries:
                          dst.writestr(f"runtime/{base}", node_src.read(source_name))

                      for name, data in bootstrap_files.items():
                          dst.writestr(f"project/{name}", data)

                      for name, data in node_modules_entries:
                          normalized = name.replace("\\", "/").lstrip("/")
                          dst.writestr(f"project/{normalized}", data)

                      for rel, data in core_entries:
                          dst.writestr(f"project/danmu_api_stable/{rel}", data)

                      # Required writable runtime paths. Empty .env fixes Web-panel saves.
                      dst.writestr("project/config/.env", b"")
                      dst.writestr("project/tmp/.keep", b"")

                  packages.extend([
                      {
                          "file": node_zip.name,
                          "abi": abi,
                          "type": "node-full",
                          "bytes": node_zip.stat().st_size,
                          "sha256": sha256(node_zip),
                      },
                      {
                          "file": bundle.name,
                          "abi": abi,
                          "type": "logvar-full-bundle",
                          "bytes": bundle.stat().st_size,
                          "sha256": sha256(bundle),
                      },
                  ])

          manifest = {
              "schemaVersion": 2,
              "primaryAbi": "arm64-v8a",
              "nodeFlavor": "full",
              "generatedFrom": {
                  "nodeVersion": NODE_VERSION,
                  "nodeFullUniversalSha256": "e3cd29a1be03405f11dd5c857af8cd3ad13f84f1409ea648f5328f0bada5bd76",
                  "androidBootstrapCommit": SHELL_COMMIT,
                  "runtimePackSha256": "4be12e7971f079cd357496974113342f6839919a247e24b4fee69a594301c8a7",
                  "coreCommit": CORE_COMMIT,
              },
              "notes": {
                  "bootstrap": "JavaScript; ABI-independent",
                  "nodeModules": "JavaScript dependencies; ABI-independent in this pruned pack",
                  "core": "JavaScript; ABI-independent",
                  "nativeAbiBoundary": "Only Node native runtime differs per ABI",
              },
              "packages": packages,
          }

          (out / "remote-deps-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          for item in packages:
              print(
                  f'{item["file"]}: {item["bytes"]} bytes '
                  f'abi={item["abi"]} type={item["type"]} sha256={item["sha256"]}'
              )

      - name: Upload dependency ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: remote-dependency-zips
          path: out/*
          compression-level: 0

      - name: Publish stable runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="runtime-full-v24.21.0-0-v0.3.2"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Full Node + LogVar runtime v0.3.2" \
              --notes "Per-ABI FULL Node.js Mobile runtime bundles. arm64-v8a is the primary Android package; armeabi-v7a and x86_64 are separate compatibility assets."
          fi
          gh release upload "$TAG" out/* --clobber
