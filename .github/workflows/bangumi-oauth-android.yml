name: Bangumi OAuth Android Release
on:
  push:
    branches:
      - build/bangumi-oauth-apk-20261013
  pull_request:
    branches:
      - main
jobs:
  android-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble optimized signed release APK
        run: gradle --no-daemon -p bangumi-oauth-android :app:assembleRelease
      - name: Verify release APK
        run: |
          test -s bangumi-oauth-android/app/build/outputs/apk/release/app-release.apk
          sha256sum bangumi-oauth-android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bangumi-oauth-release-apk
          path: bangumi-oauth-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
