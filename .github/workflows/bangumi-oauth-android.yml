name: Bangumi Glass v2.3 Liquid UX & Anime Season
on:
  push:
    branches:
      - build/bangumi-glass-ux-season-v230-20261014
  pull_request:
    branches:
      - main
jobs:
  android-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOL="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          echo "Using $TOOL"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate API catalog from official OpenAPI
        run: |
          python -m pip install --user pyyaml
          python bangumi-oauth-android/scripts/generate_catalog.py
          test -s bangumi-oauth-android/app/src/main/assets/bangumi_api_catalog.json
      - name: Run JSON wire-format regression tests
        run: gradle --no-daemon -p bangumi-oauth-android :app:testReleaseUnitTest
      - name: Assemble optimized signed release APK
        run: gradle --no-daemon -p bangumi-oauth-android :app:assembleRelease
      - name: Verify release APK
        run: |
          test -s bangumi-oauth-android/app/build/outputs/apk/release/app-release.apk
          sha256sum bangumi-oauth-android/app/build/outputs/apk/release/app-release.apk
          ls -lh bangumi-oauth-android/app/build/outputs/apk/release
          test -s bangumi-oauth-android/app/build/outputs/mapping/release/mapping.txt
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs bangumi-oauth-android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bangumi-glass-230-liquid-ux-release-apk
          path: bangumi-oauth-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Add Gradle wrapper to distributable source
        run: gradle --no-daemon -p bangumi-oauth-android wrapper --gradle-version 8.11.1
      - name: Package Android Studio source
        run: |
          zip -qr bangumi-glass-source.zip bangumi-oauth-android \
            -x "*/build/*" "*/.gradle/*"
      - uses: actions/upload-artifact@v4
        with:
          name: bangumi-glass-230-liquid-ux-android-studio-source
          path: bangumi-glass-source.zip
          retention-days: 7

  emulator-visual:
    name: Android 15 visual verification
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare SDK36 and official catalog
        run: |
          ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOL="$(find "$ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
          python -m pip install --user pyyaml
          python bangumi-oauth-android/scripts/generate_catalog.py
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Render actual screens in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-boot-timeout: 900
          disable-animations: false
          script: |
            set -e
            gradle --no-daemon -p bangumi-oauth-android :app:assembleDebug
            adb install -r bangumi-oauth-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.example.bangumioauthdemo/.BangumiHomeActivity
            sleep 16
            mkdir -p ui-screenshots
            adb shell screencap -p /sdcard/overview.png
            adb pull /sdcard/overview.png ui-screenshots/01-overview.png
            SIZE="$(adb shell wm size | sed -n 's/Physical size: //p' | tr -d '\r')"
            W="${SIZE%x*}"
            H="${SIZE#*x}"
            Y="$((H - 105))"
            adb shell input tap "$((W / 2))" "$Y"
            sleep 11
            adb shell screencap -p /sdcard/season.png
            adb pull /sdcard/season.png ui-screenshots/02-season-tv.png
            adb shell input tap "$((W * 9 / 10))" "$Y"
            sleep 7
            adb shell screencap -p /sdcard/profile.png
            adb pull /sdcard/profile.png ui-screenshots/03-profile.png
            adb logcat -d -s AndroidRuntime:E > ui-screenshots/android-runtime-errors.log || true
            if grep -q 'FATAL EXCEPTION' ui-screenshots/android-runtime-errors.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bangumi-glass-230-android-emulator-screenshots
          path: ui-screenshots
          retention-days: 7
