name: Bangumi Glass v2.0.1 Collection Fix
on:
  push:
    branches:
      - build/bangumi-glass-fix-json415-20261014
  pull_request:
    branches:
      - main
jobs:
  android-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOL="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          echo "Using $TOOL"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate API catalog from official OpenAPI
        run: |
          python -m pip install --user pyyaml
          python bangumi-oauth-android/scripts/generate_catalog.py
          test -s bangumi-oauth-android/app/src/main/assets/bangumi_api_catalog.json
      - name: Run JSON wire-format regression tests
        run: gradle --no-daemon -p bangumi-oauth-android :app:testReleaseUnitTest
      - name: Assemble optimized signed release APK
        run: gradle --no-daemon -p bangumi-oauth-android :app:assembleRelease
      - name: Verify release APK
        run: |
          test -s bangumi-oauth-android/app/build/outputs/apk/release/app-release.apk
          sha256sum bangumi-oauth-android/app/build/outputs/apk/release/app-release.apk
          ls -lh bangumi-oauth-android/app/build/outputs/apk/release
          test -s bangumi-oauth-android/app/build/outputs/mapping/release/mapping.txt
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs bangumi-oauth-android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bangumi-glass-201-fix-415-release-apk
          path: bangumi-oauth-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Add Gradle wrapper to distributable source
        run: gradle --no-daemon -p bangumi-oauth-android wrapper --gradle-version 8.11.1
      - name: Package Android Studio source
        run: |
          zip -qr bangumi-glass-source.zip bangumi-oauth-android \
            -x "*/build/*" "*/.gradle/*"
      - uses: actions/upload-artifact@v4
        with:
          name: bangumi-glass-201-fix-415-android-studio-source
          path: bangumi-glass-source.zip
          retention-days: 7
